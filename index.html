<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takumoto — Каталог достопримечательностей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="logo">Takumoto</h1>
            <p class="subtitle">Откройте для себя самые удивительные места мира</p>
        </div>
    </header>

    <section class="search-section">
        <div class="container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск по названию или описанию...">
                <button id="clearBtn" class="btn-clear">✕</button>
            </div>
            <div class="filter-tags">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="история">История</button>
                <button class="filter-btn" data-filter="природа">Природа</button>
                <button class="filter-btn" data-filter="архитектура">Архитектура</button>
                <button class="filter-btn" data-filter="культура">Культура</button>
            </div>
        </div>
    </section>

    <main class="catalog">
        <div class="container">
            <div class="attractions-grid" id="attractionsGrid">
                <!-- Карточки достопримечательностей будут вставлены здесь через JS -->
            </div>
        </div>
    </main>

    <!-- Модальное окно с подробным описанием -->
    <div class="modal" id="detailModal">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-body">
                <div class="modal-image-wrapper">
                    <img id="modalImage" src="" alt="">
                </div>
                <div class="modal-info">
                    <h2 id="modalTitle"></h2>
                    <div class="modal-meta">
                        <span class="modal-category" id="modalCategory"></span>
                        <span class="modal-location" id="modalLocation">📍 </span>
                    </div>
                    <p id="modalDescription"></p>
                    <div class="modal-facts">
                        <div class="fact">
                            <span class="fact-label">Тип:</span>
                            <span class="fact-value" id="modalType"></span>
                        </div>
                        <div class="fact">
                            <span class="fact-label">Эпоха / период:</span>
                            <span class="fact-value" id="modalEra"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Takumoto. Каталог достопримечательностей.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
